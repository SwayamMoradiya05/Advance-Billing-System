{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Advance Billing System{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="app-header">
        <div class="container header-container">
            <div class="logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">BillingSystem</span>
            </div>
            <nav class="nav-menu">
                <a href="{% url 'billing:index' %}" class="nav-link active">Dashboard</a>
                <a href="/admin/" class="nav-link">Admin Portal</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="app-footer">
        <div class="container footer-container">
            <p>&copy; 2026 Advance Billing System. Powered by Django & SQLite3.</p>
        </div>
    </footer>
</body>
</html>
