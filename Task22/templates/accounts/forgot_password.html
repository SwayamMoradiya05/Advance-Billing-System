<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ADM Governance Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            background-color: #131b2e;
            border: 1px solid #1f293d;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .brand-badge {
            background-color: #10b981;
            color: #0b0f19;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .card-subtitle {
            font-size: 0.875rem;
            color: #9ca3af;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .form-control {
            width: 100%;
            background-color: #0b0f19;
            border: 1px solid #1f293d;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-control:focus {
            border-color: #10b981;
        }

        .otp-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .otp-input {
            width: 44px;
            height: 48px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            background-color: #0b0f19;
            border: 1px solid #1f293d;
            border-radius: 8px;
            color: #ffffff;
            outline: none;
        }

        .otp-input:focus {
            border-color: #10b981;
        }

        .resend-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 1.25rem;
        }

        .btn-resend {
            background: none;
            border: none;
            color: #10b981;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-resend:disabled {
            color: #6b7280;
            cursor: not-allowed;
        }

        .btn-submit {
            width: 100%;
            background-color: #10b981;
            color: #0b0f19;
            border: none;
            border-radius: 8px;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #34d399;
        }

        .alert-box {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }

        .hidden {
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.25rem;
            color: #9ca3af;
            text-decoration: none;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <span class="brand-badge">ADM</span>
            <span class="brand-title">Admin Governance Suite</span>
        </div>

        <h1 class="card-title">Forgot Password</h1>
        <p class="card-subtitle">Reset your account access using OTP verification</p>

        <div id="errorAlert" class="alert-box hidden"></div>

        <!-- Step 1: Email Form -->
        <form id="emailForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="userEmail">Email / Username</label>
                <input type="text" id="userEmail" class="form-control" placeholder="Enter your email or username" required>
            </div>
            <button type="submit" class="btn-submit">Send OTP Code →</button>
        </form>

        <!-- Step 2: OTP Verification & Reset -->
        <form id="otpForm" class="hidden">
            {% csrf_token %}
            <p style="font-size:0.85rem; color:#9ca3af; margin-bottom:1rem; text-align:center;">
                Code sent to <strong id="displayEmail" style="color:#fff;"></strong>
            </p>

            <div class="otp-container">
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
                <input type="text" maxlength="1" class="otp-input" required>
            </div>

            <div class="resend-row">
                <span>Didn't receive code?</span>
                <button type="button" id="resendBtn" class="btn-resend" disabled>
                    Resend OTP (<span id="timer">30</span>s)
                </button>
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
            </div>

            <button type="submit" class="btn-submit">Update Password</button>
        </form>

        <!-- Step 3: Success Screen -->
        <div id="successBox" class="hidden" style="text-align: center; padding: 1rem 0;">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">✅</div>
            <h3 style="color:#fff; margin-bottom:0.5rem;">Password Reset!</h3>
            <p style="font-size:0.875rem; color:#9ca3af; margin-bottom:1.5rem;">Your password has been reset successfully.</p>
            <a href="{% url 'login' %}" class="btn-submit" style="display:block; text-decoration:none;">Back to Sign In</a>
        </div>

        <a href="{% url 'login' %}" class="back-link">← Return to Login</a>
    </div>

    <script>
        const emailForm = document.getElementById('emailForm');
        const otpForm = document.getElementById('otpForm');
        const successBox = document.getElementById('successBox');
        const errorAlert = document.getElementById('errorAlert');
        const resendBtn = document.getElementById('resendBtn');
        const timerSpan = document.getElementById('timer');
        const otpInputs = document.querySelectorAll('.otp-input');

        let countdown = 30;
        let timer = null;

        function showError(msg) {
            errorAlert.textContent = msg;
            errorAlert.classList.remove('hidden');
        }

        function clearError() {
            errorAlert.classList.add('hidden');
        }

        function startResendTimer() {
            countdown = 30;
            resendBtn.disabled = true;
            resendBtn.innerHTML = `Resend OTP (<span id="timer">${countdown}</span>s)`;

            clearInterval(timer);
            timer = setInterval(() => {
                countdown--;
                const t = document.getElementById('timer');
                if (t) t.textContent = countdown;
                if (countdown <= 0) {
                    clearInterval(timer);
                    resendBtn.disabled = false;
                    resendBtn.textContent = 'Resend OTP';
                }
            }, 1000);
        }

        emailForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();
            const val = document.getElementById('userEmail').value.trim();
            if (!val) return;

            try {
                const response = await fetch('/api/request-otp/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                    },
                    body: JSON.stringify({ email: val })
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(data.error || 'Failed to request OTP');
                    return;
                }
                document.getElementById('displayEmail').textContent = val;
                emailForm.classList.add('hidden');
                otpForm.classList.remove('hidden');
                otpInputs[0].focus();
                startResendTimer();
            } catch (err) {
                showError('Network error. Please try again.');
            }
        });

        otpInputs.forEach((box, i) => {
            box.addEventListener('input', (e) => {
                if (e.target.value && i < otpInputs.length - 1) {
                    otpInputs[i + 1].focus();
                }
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && i > 0) {
                    otpInputs[i - 1].focus();
                }
            });

            box.addEventListener('paste', (e) => {
                e.preventDefault();
                const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
                if (/^\d+$/.test(paste)) {
                    const digits = paste.split('');
                    otpInputs.forEach((input, index) => {
                        if (digits[index]) input.value = digits[index];
                    });
                    const lastIndex = Math.min(digits.length - 1, otpInputs.length - 1);
                    otpInputs[lastIndex].focus();
                }
            });
        });

        resendBtn.addEventListener('click', async () => {
            if (resendBtn.disabled) return;
            clearError();
            const val = document.getElementById('userEmail').value.trim();
            try {
                const response = await fetch('/api/request-otp/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                    },
                    body: JSON.stringify({ email: val })
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(data.error || 'Failed to resend OTP');
                    return;
                }
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
                startResendTimer();
            } catch (err) {
                showError('Network error. Please try again.');
            }
        });

        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearError();

            const code = Array.from(otpInputs).map(input => input.value).join('');
            if (code.length < 6) {
                showError('Please enter all 6 digits of the OTP.');
                return;
            }

            const p1 = document.getElementById('newPassword').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                showError('Passwords do not match.');
                return;
            }

            const email = document.getElementById('userEmail').value.trim();

            try {
                const response = await fetch('/api/verify-otp/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || ''
                    },
                    body: JSON.stringify({
                        email: email,
                        code: code,
                        new_password: p1
                    })
                });
                const data = await response.json();
                if (!response.ok) {
                    showError(data.error || 'Invalid OTP code.');
                    return;
                }
                otpForm.classList.add('hidden');
                successBox.classList.remove('hidden');
            } catch (err) {
                showError('Network error. Please try again.');
            }
        });
    </script>
</body>
</html>
